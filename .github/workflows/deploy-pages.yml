name: Deploy landing page

# Publishes apps/landing to THIS repository's `gh-pages` branch, which GitHub
# Pages serves at https://gitalk.github.io/gitalk/.
#
# No extra secret is required: the default GITHUB_TOKEN already has
# `contents: write` on this repo.
#
# To move the site to the bare domain later (https://gitalk.github.io without
# the /gitalk suffix), switch `github_token` to a PAT via `personal_token` +
# `external_repository: gitalk/gitalk.github.io`. That variant needs a secret
# because the default token cannot push across repositories — see
# docs/tech.md §8 for why the user-page repo wins over a project Pages branch.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Core must be built first: the landing page imports @gitalk/core.
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build core
        run: pnpm --filter @gitalk/core run build
      - name: Build landing
        run: pnpm build:landing

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apps/landing/dist
          force_orphan: true
          user_name: gitalk-bot
          user_email: bot@gitalk.github.io
          commit_message: 'deploy: ${{ github.sha }}'
