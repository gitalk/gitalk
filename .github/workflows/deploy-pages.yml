name: Deploy landing page and framework demos

# Publishes three static sites to the `gh-pages` branch of
# gitalk/gitalk.github.io, which GitHub Pages serves as:
#   /       -> https://gitalk.github.io/       (apps/landing)
#   /react  -> https://gitalk.github.io/react/ (apps/demo-react)
#   /vue    -> https://gitalk.github.io/vue/   (apps/demo-vue)
#
# Why a separate repo: only a repo literally named `<org>.github.io` can serve
# the bare domain. A `gh-pages` branch inside gitalk/gitalk would be served at
# https://gitalk.github.io/gitalk/ instead.
#
# Why a deploy key: the default GITHUB_TOKEN is scoped to this repository and
# cannot push across repos. `GH_PAGES_DEPLOY_KEY` is an SSH deploy key with
# write access to gitalk/gitalk.github.io only — repo-scoped and revocable,
# unlike a PAT, which would carry account-wide scope.
#
# The target repo's Pages source must stay configured to build from `gh-pages`.
# Its `master` branch still holds the original v1 demo and is left untouched as
# an archive.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'apps/demo-react/**'
      - 'apps/demo-vue/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Only `contents: read` is needed: publishing authenticates with the deploy
# key, not with GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Core must be built first: the landing page imports @aifire/gitalk.
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build core
        run: pnpm --filter @aifire/gitalk run build
      # Baked in at build time. Reading it in the browser would spend every
      # visitor's anonymous GitHub quota (60/hour per IP) on a number that
      # changes a few times a week — and would show a stale or empty value
      # whenever that quota ran out.
      - name: Read the star count
        run: |
          set -euo pipefail
          stars=$(curl -fsSL --max-time 20 https://api.github.com/repos/gitalk/gitalk | jq -r '.stargazers_count // empty')
          if [ -z "$stars" ]; then
            echo "::warning::could not read the star count; the page will use its fallback"
            exit 0
          fi
          if [ "$stars" -lt 1000 ]; then
            value="$stars"
          else
            value=$(awk -v n="$stars" 'BEGIN { printf "%.1fk", n / 1000 }')
          fi
          echo "GITALK_STARS=$value" >> "$GITHUB_ENV"
          echo "stars: $stars -> $value"

      # package.json holds the *baseline* (2.0.0-beta.0); the publish flow
      # computes the real number and never writes it back. So ask npm what was
      # actually published rather than reading a version that is always stale.
      - name: Read the published version
        run: |
          set -euo pipefail
          version=$(curl -fsSL --max-time 20 \
            "https://registry.npmjs.org/@aifire%2fgitalk" | jq -r '.["dist-tags"].latest // empty')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::warning::could not read the published version; the page will use package.json"
            exit 0
          fi
          echo "GITALK_VERSION=$version" >> "$GITHUB_ENV"
          echo "version: $version"

      - name: Build landing
        run: pnpm build:landing

      # The demos consume the *published* @aifire/gitalk-react / -vue packages
      # from npm, not the workspace copies (whose package.json still holds the
      # pre-publish baseline). No dependency on the core build above.
      - name: Build React demo
        run: pnpm --filter @gitalk/demo-react run build

      - name: Build Vue demo
        run: pnpm --filter @gitalk/demo-vue run build

      # One artifact for all three sites: landing at the root, each demo under
      # the subpath its vite.config.ts already declares as `base`.
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/react deploy/vue
          cp -R apps/landing/dist/. deploy/
          cp -R apps/demo-react/dist/. deploy/react/
          cp -R apps/demo-vue/dist/. deploy/vue/
          # Without this, GitHub Pages runs the files through Jekyll, which
          # skips files and directories whose names begin with `_` — exactly
          # what Vite emits (`_plugin-vue_export-helper-*.js` and friends).
          touch deploy/.nojekyll

      - name: Publish to gitalk.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: gitalk/gitalk.github.io
          publish_branch: gh-pages
          publish_dir: ./deploy
          force_orphan: true
          user_name: gitalk-bot
          user_email: bot@gitalk.github.io
          commit_message: 'deploy: ${{ github.sha }}'
