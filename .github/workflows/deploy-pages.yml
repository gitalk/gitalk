name: Deploy landing page

# Publishes apps/landing to the `gh-pages` branch of gitalk/gitalk.github.io,
# which GitHub Pages serves at https://gitalk.github.io/ (the bare org domain).
#
# Why a separate repo: only a repo literally named `<org>.github.io` can serve
# the bare domain. A `gh-pages` branch inside gitalk/gitalk would be served at
# https://gitalk.github.io/gitalk/ instead.
#
# Why a deploy key: the default GITHUB_TOKEN is scoped to this repository and
# cannot push across repos. `GH_PAGES_DEPLOY_KEY` is an SSH deploy key with
# write access to gitalk/gitalk.github.io only — repo-scoped and revocable,
# unlike a PAT, which would carry account-wide scope.
#
# The target repo's Pages source must stay configured to build from `gh-pages`.
# Its `master` branch still holds the original v1 demo and is left untouched as
# an archive.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Only `contents: read` is needed: publishing authenticates with the deploy
# key, not with GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Core must be built first: the landing page imports @gitalk/core.
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build core
        run: pnpm --filter @gitalk/core run build
      - name: Build landing
        run: pnpm build:landing

      - name: Publish to gitalk.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.GH_PAGES_DEPLOY_KEY }}
          external_repository: gitalk/gitalk.github.io
          publish_branch: gh-pages
          publish_dir: ./apps/landing/dist
          force_orphan: true
          user_name: gitalk-bot
          user_email: bot@gitalk.github.io
          commit_message: 'deploy: ${{ github.sha }}'
